<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Memory Match: Glass Edition</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.65);
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --card-back: #6c5ce7;
            --accent: #6c5ce7;
            --active-player: #00b894;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            /* Replace MatchBG.png with your actual image path or a URL */
            background-image: url('MatchBG.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #a29bfe; /* Fallback color */
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2d3436;
            overflow: hidden; /* Prevents body scroll bars */
        }

        /* --- LOBBY SCREEN (No Changes) --- */
        .lobby-container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 24px;
            border: var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .lobby-container label {
            color: #444; 
            font-weight: bold;
            font-size: 1rem;
            margin-right: 10px;
        }

        .mode-select {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 15px 25px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.8);
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            flex: 1;
        }

        .mode-btn.selected {
            border-color: var(--accent);
            background: #eef2ff;
            color: var(--accent);
        }

        .player-setup {
            display: grid;
            gap: 15px;
            text-align: left;
            margin-bottom: 25px;
        }

        .player-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input {
            font-weight: bold;
            font-size: 1rem;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid var(--accent);
            transition: 0.3s;
            width: 100%;
            color: #3b3b3b;
            background: rgba(255,255,255,0.9);
        }

        input:focus {
            background: white;
            outline: none;
            color: var(--accent);
        }

        .avatar-select {
            font-size: 1.5rem;
            cursor: pointer;
            background: rgba(255,255,255,0.9);
            padding: 5px;
            border-radius: 8px;
            border: 2px solid var(--accent);
            color: var(--accent);
            width: 50px;
            text-align: center;
        }

        .avatar-select:hover {
            background: #f3e9ff;
        }

        #difficulty {
            font-weight: bold;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 8px;      
            border: 2px solid var(--accent);
            background: rgba(255,255,255,0.9);
            color: #3b3b3b;          
            font-family: var(--font-main);
            transition: 0.3s;
            cursor: pointer;
        }

        /* --- GAME UI --- */
        header {
            width: fit-content;
            min-width: 300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: var(--glass-border);
            padding: 10px 25px;
            border-radius: 50px;
            display: none; /* Hidden until game starts */
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            /* NEW: Use flex column for mobile if needed, but row default is fine for desktop */
            flex-direction: row; 
        }

        .scoreboard {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: nowrap; /* Default desktop view */
        }

        .player-score {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 15px;
            border-radius: 50px;
            transition: 0.3s;
            opacity: 0.6;
        }

        .player-score.active {
            background: white;
            opacity: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid var(--active-player);
        }

        .avatar { font-size: 1.4rem; }
        .score-val { font-weight: bold; font-size: 1.2rem; margin-left: 5px; }
        
        /* NEW: Button styling (for better visual appeal) */
        .restart-btn {
            background: none; 
            border: none; 
            cursor: pointer; 
            font-size: 1.5rem; 
            margin-left: 15px; 
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .restart-btn:hover {
            opacity: 1;
        }

        /* --- GRID & CARDS --- */
        
        .game-container {
            perspective: 1000px;
            display: none; 
            
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            
            border-radius: 20px;
            padding: 20px;
            width: fit-content; 
            max-width: 95vw;    
            margin: 0 auto;
        }

        .grid {
            display: grid;
            gap: 12px;
            margin: 0 auto;
        }

        .card {
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            aspect-ratio: 3/4;
            width: 70px; 
        }

        .card.flipped { transform: rotateY(180deg); }
        
        .card-face {
            width: 100%; height: 100%; position: absolute;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            backface-visibility: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            font-size: 2rem;
        }

        .card-front { 
            background: white; 
            transform: rotateY(180deg); 
            border: 2px solid white;
        }
        
        .card-back { 
            background: var(--card-back);
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 10px, transparent 10px, transparent 20px);
        }

        .card.matched .card-front {
            background: #e6fffa;
            border: 2px solid #00b894;
        }

        .primary-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
            transition: 0.2s;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
        }
        
        .hidden { display: none !important; }

        /* Modal (No Changes) */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
            z-index: 100;
        }
        .modal.visible { opacity: 1; pointer-events: all; }
        .modal-content {
            background: white; padding: 40px; border-radius: 24px;
            text-align: center; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        /* Fix for scrolling on hard (6x6) */
        .game-container.hard-difficulty .card {
            width: 60px; /* Slightly smaller cards for 6x6 to ensure vertical fit */
            font-size: 1.7rem; /* Shrink font too */
        }
        
        /* Responsive tweaks */
        @media (max-width: 600px) {
            .card { width: 55px; font-size: 1.5rem; }
            .lobby-container { padding: 25px; }
            .game-container { padding: 15px; }
            .grid { gap: 8px; }
            
            /* Keep hard cards even smaller on mobile */
            .game-container.hard-difficulty .card {
                width: 45px; 
                font-size: 1.2rem;
            }
            
            /* 🌟 MOBILE HEADER REFINEMENT FIX 🌟 */
            header {
                /* Make it taller to accommodate wrapped content */
                width: 95%; 
                max-width: 450px;
                padding: 10px 15px;
                /* Align items to center when multi-line */
                align-items: flex-start; 
                flex-direction: column; /* Stack scoreboard and button vertically */
            }
            
            .scoreboard {
                /* Allow items to wrap into a 2x2 grid */
                flex-wrap: wrap; 
                justify-content: space-between; /* Space out the player boxes */
                gap: 5px 10px; /* Vertical and horizontal gap */
                width: 100%; /* Take full width of the header */
                margin-bottom: 5px;
            }

            .player-score {
                /* Allows the two player boxes to sit side-by-side */
                flex: 1 1 45%; 
                min-width: 120px;
                font-size: 0.9rem;
            }
            
            #center-stat {
                /* Puts "VS" on its own center line, visually separating the scores */
                order: 3; 
                width: 100%;
                text-align: center;
                margin: 0 !important;
                font-size: 0.9rem;
                padding: 5px 0;
            }

            .restart-btn {
                /* Position the button on the next line to the right */
                align-self: flex-end;
                margin: 0;
            }
            /* 🌟 END MOBILE HEADER REFINEMENT FIX 🌟 */
        }
    </style>
</head>
<body>

    <div class="lobby-container" id="lobby">
        <h1 style="margin-bottom: 20px; color: var(--accent);">Zen Match</h1>
        
        <div class="mode-select">
            <div class="mode-btn selected" onclick="setMode('solo')">Solo</div>
            <div class="mode-btn" onclick="setMode('local')">Multiplayer</div>
        </div>

        <div class="player-setup" id="setup-p1">
            <div class="player-row">
                <div class="avatar-select" onclick="cycleAvatar(1)">🦊</div>
                <input type="text" id="p1-name" value="Player 1" placeholder="Name">
            </div>
        </div>

        <div class="player-setup hidden" id="setup-p2">
            <div class="player-row">
                <div class="avatar-select" onclick="cycleAvatar(2)">🐼</div>
                <input type="text" id="p2-name" value="Player 2" placeholder="Name">
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <label>Difficulty: </label>
            <select id="difficulty">
                <option value="easy">Easy (4x4)</option>
                <option value="medium" selected>Medium (5x4)</option>
                <option value="hard">Hard (6x6)</option>
            </select>
        </div>

        <button class="primary-btn" onclick="startGame()">Start Game</button>
    </div>

    <header id="game-header">
        <div class="scoreboard">
            <div class="player-score active" id="score-p1-box">
                <span class="avatar" id="disp-av-1">🦊</span>
                <span id="disp-name-1">Player 1</span>
                <span class="score-val" id="score-p1">0</span>
            </div>
            
            <div id="center-stat" style="font-weight:bold; color: #555; margin: 0 10px;">VS</div>

            <div class="player-score hidden" id="score-p2-box">
                <span class="avatar" id="disp-av-2">🐼</span>
                <span id="disp-name-2">Player 2</span>
                <span class="score-val" id="score-p2">0</span>
            </div>
        </div>
        
        <button onclick="location.reload()" title="Restart" class="restart-btn">🔄</button>
    </header>

    <div class="game-container" id="game-container">
        <div class="grid" id="grid"></div>
    </div>

    <div class="modal" id="end-modal">
        <div class="modal-content">
            <h2 id="end-title" style="color: var(--accent);">Game Over</h2>
            <p id="end-msg" style="margin: 20px 0; font-size: 1.2rem; color: #555;"></p>
            <button class="primary-btn" onclick="location.reload()">Return to Lobby</button>
        </div>
    </div>

    <script>
        // --- ASSETS & CONFIG ---
        const AVATARS = ['🦊', '🐼', '🐸', '🦁', '🐷', '🐙', '🦄', '👽', '🐮', '🐯'];
        const ICONS = ['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🫐','🍈','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🥑'];
        
        const CONFIG = {
            easy: { rows: 4, cols: 4, pairs: 8 },
            medium: { rows: 5, cols: 4, pairs: 10 },
            hard: { rows: 6, cols: 6, pairs: 18 }
        };

        // --- STATE ---
        let state = {
            mode: 'solo', // 'solo' or 'local'
            difficulty: 'medium',
            turn: 1, // 1 or 2
            scores: { 1: 0, 2: 0 },
            cards: [],
            flipped: [],
            locked: false,
            p1: { name: 'Player 1', avatar: '🦊' },
            p2: { name: 'Player 2', avatar: '🐼' },
            totalPairs: 0,
            foundPairs: 0,
            timer: 0,
            timerInterval: null
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // --- LOBBY LOGIC ---
        function setMode(mode) {
            state.mode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');

            if (mode === 'local') {
                document.getElementById('setup-p2').classList.remove('hidden');
            } else {
                document.getElementById('setup-p2').classList.add('hidden');
            }
        }

        let avIdx1 = 0;
        let avIdx2 = 1;
        function cycleAvatar(p) {
            const arr = AVATARS;
            if (p === 1) {
                avIdx1 = (avIdx1 + 1) % arr.length;
                document.querySelector('#setup-p1 .avatar-select').innerText = arr[avIdx1];
            } else {
                avIdx2 = (avIdx2 + 1) % arr.length;
                document.querySelector('#setup-p2 .avatar-select').innerText = arr[avIdx2];
            }
        }

        function startGame() {
            // Get Info
            state.difficulty = document.getElementById('difficulty').value;
            state.p1.name = document.getElementById('p1-name').value || 'Player 1';
            state.p1.avatar = document.querySelector('#setup-p1 .avatar-select').innerText;
            
            if (state.mode === 'local') {
                state.p2.name = document.getElementById('p2-name').value || 'Player 2';
                state.p2.avatar = document.querySelector('#setup-p2 .avatar-select').innerText;
            }

            // UI Transition
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-header').style.display = 'flex';
            
            // Show the glass container 
            document.getElementById('game-container').style.display = 'block';

            setupBoard();
            updateScoreUI();
        }

        function setupBoard() {
            const conf = CONFIG[state.difficulty];
            state.totalPairs = conf.pairs;
            const gameContainer = document.getElementById('game-container');

            // 🌟 NEW: Add class to container if it's hard difficulty
            if (state.difficulty === 'hard') {
                gameContainer.classList.add('hard-difficulty');
            } else {
                 gameContainer.classList.remove('hard-difficulty');
            }
            
            // Grid CSS
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${conf.cols}, 1fr)`;

            // Deck Gen
            let deck = ICONS.slice(0, conf.pairs);
            deck = [...deck, ...deck];
            deck.sort(() => Math.random() - 0.5);

            deck.forEach((icon, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.icon = icon;
                card.dataset.index = i;
                card.innerHTML = `
                    <div class="card-face card-front">${icon}</div>
                    <div class="card-face card-back"></div>
                `;
                card.onclick = () => handleCardClick(card);
                grid.appendChild(card);
            });

            if (state.mode === 'solo') {
                document.getElementById('center-stat').innerText = '00:00';
                startTimer();
            } else {
                document.getElementById('score-p2-box').classList.remove('hidden');
            }
        }

        // --- GAMEPLAY LOGIC (No Changes) ---

        function handleCardClick(card) {
            if (state.locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            playSound(400, 'sine');
            card.classList.add('flipped');
            state.flipped.push(card);

            if (state.flipped.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            state.locked = true;
            const [c1, c2] = state.flipped;
            const match = c1.dataset.icon === c2.dataset.icon;

            if (match) {
                setTimeout(() => {
                    playSound(600, 'sine');
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    state.flipped = [];
                    state.locked = false;
                    
                    // Score Update
                    state.scores[state.turn]++;
                    state.foundPairs++;
                    updateScoreUI();
                    
                    if (state.foundPairs === state.totalPairs) endGame();

                    // Note: In this ruleset, matching keeps the turn.
                }, 400);
            } else {
                setTimeout(() => {
                    playSound(150, 'triangle');
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    state.flipped = [];
                    state.locked = false;
                    
                    // Switch Turn if Multi
                    if (state.mode === 'local') {
                        state.turn = state.turn === 1 ? 2 : 1;
                        updateScoreUI();
                    }
                }, 1000);
            }
        }

        function updateScoreUI() {
            // Update Text
            document.getElementById('disp-name-1').innerText = state.p1.name;
            document.getElementById('disp-av-1').innerText = state.p1.avatar;
            document.getElementById('score-p1').innerText = state.scores[1];

            if (state.mode === 'local') {
                document.getElementById('disp-name-2').innerText = state.p2.name;
                document.getElementById('disp-av-2').innerText = state.p2.avatar;
                document.getElementById('score-p2').innerText = state.scores[2];

                // Turn Highlighting
                const p1Box = document.getElementById('score-p1-box');
                const p2Box = document.getElementById('score-p2-box');
                
                if (state.turn === 1) {
                    p1Box.classList.add('active');
                    p2Box.classList.remove('active');
                } else {
                    p1Box.classList.remove('active');
                    p2Box.classList.add('active');
                }
            } else {
                // Solo Mode UI fix
                document.getElementById('score-p1-box').classList.add('active');
            }
        }

        function startTimer() {
            state.timerInterval = setInterval(() => {
                state.timer++;
                let m = Math.floor(state.timer / 60).toString().padStart(2,'0');
                let s = (state.timer % 60).toString().padStart(2,'0');
                document.getElementById('center-stat').innerText = `${m}:${s}`;
            }, 1000);
        }

        function endGame() {
            clearInterval(state.timerInterval);
            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-msg');
            const modal = document.getElementById('end-modal');

            if (state.mode === 'solo') {
                title.innerText = "Completed!";
                msg.innerText = `Time: ${document.getElementById('center-stat').innerText}`;
            } else {
                if (state.scores[1] > state.scores[2]) {
                    title.innerText = `${state.p1.name} Wins!`;
                    msg.innerText = `${state.scores[1]} - ${state.scores[2]}`;
                } else if (state.scores[2] > state.scores[1]) {
                    title.innerText = `${state.p2.name} Wins!`;
                    msg.innerText = `${state.scores[2]} - ${state.scores[1]}`;
                } else {
                    title.innerText = "It's a Tie!";
                    msg.innerText = `${state.scores[1]} pairs each`;
                }
            }
            setTimeout(() => modal.classList.add('visible'), 500);
        }

        function playSound(freq, type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
            osc.stop(audioCtx.currentTime + 0.3);
        }
    </script>
</body>
</html>
