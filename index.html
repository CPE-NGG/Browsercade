<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dungeon: Memory Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette */
            --bg-dark: #1a0b2e;
            --bg-light: #2d1b4e;
            --neon-green: #00ff9d;
            --neon-purple: #b900ff;
            --neon-blue: #00d2ff;
            --glass-bg: rgba(45, 27, 78, 0.85);
            --border-color: #ffffff;
            --text-color: #ffffff;
            
            /* Dimensions */
            --pixel-size: 4px;
            --border-width: 4px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-dark);
            /* Retro Grid Background */
            background-image: 
                linear-gradient(rgba(185, 0, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(185, 0, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'VT323', monospace; /* Body text font */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            overflow: hidden;
            image-rendering: pixelated;
        }

        /* Scanline Overlay */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 999;
        }

        h1, h2, h3 {
            font-family: 'Press Start 2P', cursive; /* Header font */
            text-transform: uppercase;
            text-shadow: 4px 4px 0px #000;
            line-height: 1.5;
        }

        /* --- PIXEL GLASS UI --- */
        .pixel-panel {
            background: var(--glass-bg);
            /* Dither Pattern for "Pixel Glass" look */
            background-image: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 4px 4px;
            background-position: 0 0, 2px 2px;
            
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.6); /* Chunky shadow */
            position: relative;
        }

        /* Decorative corners */
        .pixel-panel::before {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border: 2px solid var(--neon-purple);
            pointer-events: none;
            z-index: -1;
        }

        /* --- LOBBY SCREEN --- */
        .lobby-container {
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            z-index: 10;
        }

        .lobby-container h1 {
            color: var(--neon-green);
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        .mode-select {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }

        /* Retro Buttons */
        .pixel-btn {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            padding: 15px 20px;
            background: #4a4a4a;
            color: #fff;
            border: 4px solid #fff;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }

        .pixel-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--neon-green);
            background: #5a5a5a;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #000;
        }

        .pixel-btn.selected {
            background: var(--neon-purple);
            box-shadow: 4px 4px 0px var(--neon-green);
        }

        .pixel-btn.primary {
            background: var(--neon-green);
            color: #000;
            width: 100%;
            font-size: 1rem;
            margin-top: 20px;
        }

        .pixel-btn.primary:hover {
            background: #fff;
            box-shadow: 6px 6px 0px var(--neon-purple);
        }

        /* Inputs */
        input, select {
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            padding: 5px 10px;
            background: #000;
            color: var(--neon-green);
            border: 2px solid #fff;
            width: 100%;
            outline: none;
            text-transform: uppercase;
        }
        
        .player-setup {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .player-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 10px;
        }

        .avatar-select {
            font-size: 2rem;
            cursor: pointer;
            background: #000;
            border: 2px solid #fff;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .avatar-select:hover {
            border-color: var(--neon-green);
        }

        /* --- SOUND SETTINGS PANEL --- */
        .sound-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .sound-btn {
            width: 40px;
            height: 40px;
            background: #000;
            border: 2px solid #fff;
            color: #555; /* Off state */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }

        .sound-btn.active {
            color: var(--neon-green);
            border-color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
        }

        /* --- GAME UI --- */
        header {
            width: fit-content;
            margin-bottom: 20px;
            display: none;
            padding: 15px 30px;
            align-items: center;
            justify-content: center;
        }

        .scoreboard {
            display: flex;
            gap: 30px;
            align-items: center;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
        }

        .player-score {
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.5;
            border-bottom: 4px solid transparent;
        }

        .player-score.active {
            opacity: 1;
            color: var(--neon-green);
            border-bottom: 4px solid var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green);
        }

        #center-stat {
            font-family: 'Press Start 2P';
            font-size: 0.8rem;
            background: #000;
            padding: 8px;
            border: 2px solid #fff;
        }

        /* --- GRID & CARDS --- */
        .game-container {
            display: none;
            padding: 20px;
            background: rgba(0,0,0,0.6);
            border: 4px solid #fff;
            box-shadow: 0 0 0 4px var(--bg-dark), 0 0 0 8px var(--neon-purple); /* Double border effect */
        }

        .grid {
            display: grid;
            gap: 15px;
            margin: 0 auto;
        }

        .card {
            position: relative;
            cursor: pointer;
            width: 70px;
            aspect-ratio: 3/4;
            transform-style: preserve-3d;
            transition: transform 0.3s steps(5); /* Stepped animation for retro feel */
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-face {
            width: 100%; height: 100%; position: absolute;
            display: flex; justify-content: center; align-items: center;
            backface-visibility: hidden;
            border: 4px solid #000;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), inset -2px -2px 0px rgba(0,0,0,0.2);
            font-size: 2rem;
            image-rendering: pixelated;
        }

        /* Card Back: Pixel Pattern */
        .card-back {
            background-color: var(--neon-purple);
            background-image: 
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
                linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
        }

        /* Card Front: Item Slot style */
        .card-front {
            background: #222;
            transform: rotateY(180deg);
            border: 2px solid var(--neon-blue);
        }

        .card.matched .card-front {
            background: var(--neon-green);
            border-color: #fff;
            box-shadow: 0 0 15px var(--neon-green);
        }

        .hidden { display: none !important; }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.2s;
            z-index: 200;
        }
        .modal.visible { opacity: 1; pointer-events: all; }
        
        .modal-content {
            border: 4px solid var(--neon-green);
            background: #000;
            padding: 40px;
            text-align: center;
            box-shadow: 10px 10px 0px var(--neon-purple);
        }

        /* Difficulty Tweaks */
        .game-container.hard-difficulty .card { width: 50px; font-size: 1.5rem; }
        
        @media (max-width: 600px) {
            .lobby-container { width: 95%; padding: 20px; }
            .card { width: 55px; }
            .game-container.hard-difficulty .card { width: 40px; font-size: 1rem; }
            .sound-panel { top: 10px; right: 10px; transform: scale(0.8); transform-origin: top right; }
        }
    </style>
</head>
<body>

    <div class="sound-panel pixel-panel">
        <div class="sound-btn active" id="btn-bgm" onclick="audioManager.toggleBGM()" title="Toggle Music">🎵</div>
        <div class="sound-btn active" id="btn-sfx" onclick="audioManager.toggleSFX()" title="Toggle SFX">🔊</div>
    </div>

    <div class="lobby-container pixel-panel" id="lobby">
        <h1>Pixel Dungeon<br>Memory Quest</h1>
        
        <div class="mode-select">
            <div class="pixel-btn selected" onclick="setMode('solo')">Solo Run</div>
            <div class="pixel-btn" onclick="setMode('local')">VS Mode</div>
        </div>

        <div class="player-setup" id="setup-p1">
            <label style="color:var(--neon-blue); font-family:'Press Start 2P'; font-size: 0.6rem;">Player 1</label>
            <div class="player-row">
                <div class="avatar-select" onclick="cycleAvatar(1)">🧙‍♂️</div>
                <input type="text" id="p1-name" value="HERO" maxlength="8">
            </div>
        </div>

        <div class="player-setup hidden" id="setup-p2">
            <label style="color:var(--neon-blue); font-family:'Press Start 2P'; font-size: 0.6rem;">Player 2</label>
            <div class="player-row">
                <div class="avatar-select" onclick="cycleAvatar(2)">🧝‍♀️</div>
                <input type="text" id="p2-name" value="RIVAL" maxlength="8">
            </div>
        </div>

        <div style="margin-bottom: 20px; text-align:left;">
            <label style="color:var(--neon-blue); font-family:'Press Start 2P'; font-size: 0.6rem;">Dungeon Depth</label>
            <select id="difficulty" style="margin-top:5px;">
                <option value="easy">Level 1 (4x4)</option>
                <option value="medium" selected>Level 2 (5x4)</option>
                <option value="hard">Level 3 (6x6)</option>
            </select>
        </div>

        <button class="pixel-btn primary" onclick="startGame()">ENTER DUNGEON</button>
    </div>

    <header class="pixel-panel" id="game-header">
        <div class="scoreboard">
            <div class="player-score active" id="score-p1-box">
                <span id="disp-av-1">🧙‍♂️</span>
                <div style="display:flex; flex-direction:column; align-items:flex-start; line-height:1;">
                    <span id="disp-name-1" style="font-size:1rem;">HERO</span>
                    <span class="score-val" id="score-p1">000</span>
                </div>
            </div>
            
            <div id="center-stat">VS</div>

            <div class="player-score hidden" id="score-p2-box">
                <span id="disp-av-2">🧝‍♀️</span>
                <div style="display:flex; flex-direction:column; align-items:flex-start; line-height:1;">
                    <span id="disp-name-2" style="font-size:1rem;">RIVAL</span>
                    <span class="score-val" id="score-p2">000</span>
                </div>
            </div>
        </div>
        <button onclick="location.reload()" title="Restart" style="background:none; border:none; cursor:pointer; font-size:1.5rem; margin-left: 20px; filter: grayscale(1);">🔙</button>
    </header>

    <div class="game-container" id="game-container">
        <div class="grid" id="grid"></div>
    </div>

    <div class="modal" id="end-modal">
        <div class="modal-content">
            <h2 id="end-title" style="color: var(--neon-green); margin-bottom: 20px;">QUEST COMPLETE</h2>
            <p id="end-msg" style="margin: 20px 0; font-family:'VT323'; font-size: 1.5rem; color: #fff;"></p>
            <button class="pixel-btn primary" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // --- 8-BIT AUDIO ENGINE ---
        const audioManager = {
            ctx: new (window.AudioContext || window.webkitAudioContext)(),
            bgmOscillators: [],
            isBGM: true,
            isSFX: true,
            isPlaying: false,

            init: function() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },

            toggleSFX: function() {
                this.isSFX = !this.isSFX;
                const btn = document.getElementById('btn-sfx');
                btn.classList.toggle('active');
                btn.innerText = this.isSFX ? '🔊' : '🔇';
                if(this.isSFX) this.playTone(600, 'square', 0.1);
            },

            toggleBGM: function() {
                this.isBGM = !this.isBGM;
                const btn = document.getElementById('btn-bgm');
                btn.classList.toggle('active');
                
                if (this.isBGM) {
                    this.startBGM();
                } else {
                    this.stopBGM();
                }
            },

            playTone: function(freq, type, duration, time = 0) {
                if (!this.isSFX) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + time);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + time);
                
                // Envelope
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime + time);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + time + duration);
                osc.stop(this.ctx.currentTime + time + duration);
            },

            playFlip: function() {
                // Short digital blip
                this.playTone(400, 'square', 0.1);
                this.playTone(600, 'square', 0.05, 0.05);
            },

            playMatch: function() {
                // Triumphant Fanfare (Major Arpeggio)
                this.playTone(523.25, 'triangle', 0.2, 0);   // C5
                this.playTone(659.25, 'triangle', 0.2, 0.1); // E5
                this.playTone(783.99, 'triangle', 0.4, 0.2); // G5
                this.playTone(1046.50, 'square', 0.6, 0.3);  // C6
            },

            playWin: function() {
                // Victory sequence
                let now = 0;
                [523, 523, 523, 659, 783, 659, 783, 1046].forEach((f, i) => {
                    let type = i % 2 === 0 ? 'square' : 'triangle';
                    this.playTone(f, type, 0.3, i * 0.15);
                });
            },

            // Simple generative ambient loop
            startBGM: function() {
                if (!this.isBGM || this.isPlaying) return;
                this.isPlaying = true;
                
                const playLoop = () => {
                    if (!this.isBGM) return;
                    
                    // Bass line (Low square wave)
                    const bassOsc = this.ctx.createOscillator();
                    const bassGain = this.ctx.createGain();
                    bassOsc.type = 'square';
                    bassOsc.frequency.value = 110; // A2
                    bassOsc.connect(bassGain);
                    bassGain.connect(this.ctx.destination);
                    
                    bassGain.gain.setValueAtTime(0.03, this.ctx.currentTime);
                    bassGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 2);
                    
                    bassOsc.start();
                    bassOsc.stop(this.ctx.currentTime + 2);

                    // High sparkle (random notes from pentatonic scale)
                    const notes = [440, 523, 587, 659, 783]; // A Minor Pentatonic
                    const note = notes[Math.floor(Math.random() * notes.length)];
                    
                    const leadOsc = this.ctx.createOscillator();
                    const leadGain = this.ctx.createGain();
                    leadOsc.type = 'triangle';
                    leadOsc.frequency.value = note;
                    leadOsc.connect(leadGain);
                    leadGain.connect(this.ctx.destination);
                    
                    leadGain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                    leadGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.5);
                    
                    leadOsc.start();
                    leadOsc.stop(this.ctx.currentTime + 1.5);

                    this.bgmTimer = setTimeout(playLoop, 2000); // Loop every 2 seconds
                };
                playLoop();
            },

            stopBGM: function() {
                this.isPlaying = false;
                clearTimeout(this.bgmTimer);
            }
        };

        // --- ASSETS & CONFIG ---
        // Using RPG-themed Emojis
        const AVATARS = ['🧙‍♂️', '🧝‍♀️', '🧛', '🧟', '🤖', '👾', '🐲', '🦄', '💀', '🤡'];
        const ICONS = ['🗡️','🛡️','🔮','💍','👑','🗝️','💎','🩸','🔥','❄️','🥩','🍷','📜','🧿','⚗️','💰','🕯️','📦'];
        
        const CONFIG = {
            easy: { rows: 4, cols: 4, pairs: 8 },
            medium: { rows: 5, cols: 4, pairs: 10 },
            hard: { rows: 6, cols: 6, pairs: 18 }
        };

        // --- GAME STATE ---
        let state = {
            mode: 'solo', 
            difficulty: 'medium',
            turn: 1, 
            scores: { 1: 0, 2: 0 },
            cards: [],
            flipped: [],
            locked: false,
            p1: { name: 'HERO', avatar: '🧙‍♂️' },
            p2: { name: 'RIVAL', avatar: '🧝‍♀️' },
            totalPairs: 0,
            foundPairs: 0,
            timer: 0,
            timerInterval: null
        };

        // --- LOBBY LOGIC ---
        function setMode(mode) {
            state.mode = mode;
            document.querySelectorAll('.pixel-btn').forEach(b => b.classList.remove('selected'));
            event.target.classList.add('selected');

            const p2Setup = document.getElementById('setup-p2');
            if (mode === 'local') {
                p2Setup.classList.remove('hidden');
            } else {
                p2Setup.classList.add('hidden');
            }
        }

        let avIdx1 = 0;
        let avIdx2 = 1;
        function cycleAvatar(p) {
            if (p === 1) {
                avIdx1 = (avIdx1 + 1) % AVATARS.length;
                document.querySelector('#setup-p1 .avatar-select').innerText = AVATARS[avIdx1];
            } else {
                avIdx2 = (avIdx2 + 1) % AVATARS.length;
                document.querySelector('#setup-p2 .avatar-select').innerText = AVATARS[avIdx2];
            }
        }

        function startGame() {
            // Audio Start
            audioManager.init();
            audioManager.playTone(880, 'square', 0.2); // Start chime
            audioManager.startBGM();

            // Get Data
            state.difficulty = document.getElementById('difficulty').value;
            state.p1.name = document.getElementById('p1-name').value || 'HERO';
            state.p1.avatar = document.querySelector('#setup-p1 .avatar-select').innerText;
            
            if (state.mode === 'local') {
                state.p2.name = document.getElementById('p2-name').value || 'RIVAL';
                state.p2.avatar = document.querySelector('#setup-p2 .avatar-select').innerText;
            }

            // Transition
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-header').style.display = 'flex';
            document.getElementById('game-container').style.display = 'block';

            setupBoard();
            updateScoreUI();
        }

        function setupBoard() {
            const conf = CONFIG[state.difficulty];
            state.totalPairs = conf.pairs;
            const gameContainer = document.getElementById('game-container');

            // Difficulty Class for CSS sizing
            if (state.difficulty === 'hard') {
                gameContainer.classList.add('hard-difficulty');
            } else {
                 gameContainer.classList.remove('hard-difficulty');
            }
            
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${conf.cols}, 1fr)`;

            // Deck Gen
            let deck = ICONS.slice(0, conf.pairs);
            deck = [...deck, ...deck];
            deck.sort(() => Math.random() - 0.5);

            deck.forEach((icon, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.icon = icon;
                card.dataset.index = i;
                card.innerHTML = `
                    <div class="card-face card-front">${icon}</div>
                    <div class="card-face card-back"></div>
                `;
                card.onclick = () => handleCardClick(card);
                grid.appendChild(card);
            });

            if (state.mode === 'solo') {
                document.getElementById('center-stat').innerText = 'TIME 00:00';
                startTimer();
            } else {
                document.getElementById('score-p2-box').classList.remove('hidden');
            }
        }

        // --- GAMEPLAY ---
        function handleCardClick(card) {
            if (state.locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            audioManager.playFlip();
            card.classList.add('flipped');
            state.flipped.push(card);

            if (state.flipped.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            state.locked = true;
            const [c1, c2] = state.flipped;
            const match = c1.dataset.icon === c2.dataset.icon;

            if (match) {
                setTimeout(() => {
                    audioManager.playMatch();
                    c1.classList.add('matched');
                    c2.classList.add('matched');
                    state.flipped = [];
                    state.locked = false;
                    
                    state.scores[state.turn] += 100; // Retro score numbers
                    state.foundPairs++;
                    updateScoreUI();
                    
                    if (state.foundPairs === state.totalPairs) endGame();
                }, 400);
            } else {
                setTimeout(() => {
                    audioManager.playTone(150, 'sawtooth', 0.2); // Error buzz
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    state.flipped = [];
                    state.locked = false;
                    
                    if (state.mode === 'local') {
                        state.turn = state.turn === 1 ? 2 : 1;
                        updateScoreUI();
                    }
                }, 1000);
            }
        }

        function updateScoreUI() {
            document.getElementById('disp-name-1').innerText = state.p1.name;
            document.getElementById('disp-av-1').innerText = state.p1.avatar;
            // Pad scores with zeros like old games
            document.getElementById('score-p1').innerText = state.scores[1].toString().padStart(4, '0');

            if (state.mode === 'local') {
                document.getElementById('disp-name-2').innerText = state.p2.name;
                document.getElementById('disp-av-2').innerText = state.p2.avatar;
                document.getElementById('score-p2').innerText = state.scores[2].toString().padStart(4, '0');

                const p1Box = document.getElementById('score-p1-box');
                const p2Box = document.getElementById('score-p2-box');
                
                if (state.turn === 1) {
                    p1Box.classList.add('active');
                    p2Box.classList.remove('active');
                } else {
                    p1Box.classList.remove('active');
                    p2Box.classList.add('active');
                }
            } else {
                document.getElementById('score-p1-box').classList.add('active');
            }
        }

        function startTimer() {
            state.timerInterval = setInterval(() => {
                state.timer++;
                let m = Math.floor(state.timer / 60).toString().padStart(2,'0');
                let s = (state.timer % 60).toString().padStart(2,'0');
                document.getElementById('center-stat').innerText = `TIME ${m}:${s}`;
            }, 1000);
        }

        function endGame() {
            clearInterval(state.timerInterval);
            audioManager.stopBGM();
            setTimeout(() => audioManager.playWin(), 500);

            const title = document.getElementById('end-title');
            const msg = document.getElementById('end-msg');
            const modal = document.getElementById('end-modal');

            if (state.mode === 'solo') {
                title.innerText = "DUNGEON CLEARED!";
                msg.innerText = `FINAL SCORE: ${state.scores[1]}\n${document.getElementById('center-stat').innerText}`;
            } else {
                if (state.scores[1] > state.scores[2]) {
                    title.innerText = `${state.p1.name} WINS!`;
                    title.style.color = "var(--neon-green)";
                } else if (state.scores[2] > state.scores[1]) {
                    title.innerText = `${state.p2.name} WINS!`;
                    title.style.color = "var(--neon-purple)";
                } else {
                    title.innerText = "DRAW GAME";
                    title.style.color = "#fff";
                }
                msg.innerText = `SCORE: ${state.scores[1]} - ${state.scores[2]}`;
            }
            setTimeout(() => modal.classList.add('visible'), 500);
        }
    </script>
</body>
</html>
