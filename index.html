<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BROWSERCADE</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* --- 1. CORE VARIABLES & RESET --- */
        :root {
            /* NEW PALETTE: Cyber Blue & Neon Orange */
            --bg-color: #020b14;       /* Deepest Navy/Black */
            --grid-color: #004080;     /* Dark Blue Grid Lines */
            --grid-glow: #00f2ff;      /* Cyan Glow for Grid */
            
            --accent-primary: #ffaa00; /* Neon Orange (Buttons/Logo) */
            --accent-secondary: #00f2ff; /* Cyan (Highlights) */
            
            --card-bg: #0a1525;        /* Slate Blue Cards */
            --text-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Press Start 2P', cursive;
            color: var(--text-white);
            overflow-x: hidden;
            width: 100vw;
            min-height: 100vh;
            
            /* CRITICAL: Force pixelated rendering everywhere */
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* --- 2. CSS-GENERATED RETRO BACKGROUND --- */
        .retro-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            /* Updated to Blue/Cyan Grid */
            background: 
                linear-gradient(transparent 95%, var(--grid-glow) 95%),
                linear-gradient(90deg, transparent 95%, var(--grid-color) 95%);
            background-size: 40px 40px;
            
            /* Perspective tilt for that "Arcade Floor" look */
            transform: perspective(500px) rotateX(60deg) scale(2) translateY(-100px);
            animation: gridScroll 4s linear infinite;
            opacity: 0.5;
        }

        /* The dark sky gradient behind the grid */
        .sky-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -3;
            /* Deep Blue Gradient */
            background: linear-gradient(to bottom, #000000 0%, #051e3e 100%);
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        /* --- 3. CRT SCANLINE OVERLAY --- */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        /* --- 4. LAYOUT --- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- 5. TYPOGRAPHY & LOGO --- */
        .logo-box {
            margin-top: 40px;
            margin-bottom: 60px;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 3rem;
            color: var(--accent-secondary); /* Cyan Title */
            /* Hard pixel shadow, no blur */
            text-shadow: 
                4px 4px 0px #000,
                -2px -2px 0px #000;
            line-height: 1.5;
            margin: 0;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--accent-primary); /* Orange Subtitle */
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000;
            margin-top: 10px;
        }

        /* --- 6. PIXEL-ART BUTTONS / CARDS (NES STYLE) --- */
        .game-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            width: 100%;
        }

        .game-card {
            width: 300px;
            height: 380px;
            background-color: var(--card-bg); /* Dark Slate Card */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px; /* Inner border width */
            text-decoration: none;
            transition: transform 0.1s;
            cursor: pointer;
            
            /* The Pixel Border Magic */
            box-shadow: 
                -4px 0 0 0 #000, 
                4px 0 0 0 #000, 
                0 -4px 0 0 #000, 
                0 4px 0 0 #000;
            
            position: relative;
        }

        /* Hover Effect: "Pressing" the card */
        .game-card:hover {
            transform: translateY(4px);
            background-color: #12223a; /* Slightly lighter slate */
            box-shadow: 
                -4px 0 0 0 var(--accent-secondary), 
                4px 0 0 0 var(--accent-secondary), 
                0 -4px 0 0 var(--accent-secondary), 
                0 4px 0 0 var(--accent-secondary);
        }
        
        .game-card:active {
            transform: translateY(8px);
        }

        .card-inner {
            border: 2px solid var(--text-white);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-icon {
            font-size: 4rem;
            margin-top: 20px;
            filter: drop-shadow(4px 4px 0px #000);
            image-rendering: pixelated;
        }

        .game-title {
            color: var(--accent-primary); /* Orange Text */
            text-align: center;
            font-size: 1.2rem;
            line-height: 1.5;
            margin: 20px 0;
            text-shadow: 2px 2px 0px #000;
        }

        .game-desc {
            font-size: 0.6rem;
            color: #8faec9; /* Soft blue-grey text */
            text-align: center;
            line-height: 1.6;
            margin-bottom: auto;
        }

        /* Pixel Button inside card */
        .play-btn {
            background-color: var(--accent-primary); /* Orange Button */
            color: #000; /* Black text for contrast */
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            padding: 15px 20px;
            border: none;
            margin-bottom: 10px;
            position: relative;
            box-shadow: 
                -4px 0 0 0 #000, 
                4px 0 0 0 #000, 
                0 -4px 0 0 #000, 
                0 4px 0 0 #000;
        }

        .game-card:hover .play-btn {
            background-color: var(--text-white);
            color: #000;
            box-shadow: 
                -4px 0 0 0 var(--accent-primary), 
                4px 0 0 0 var(--accent-primary), 
                0 -4px 0 0 var(--accent-primary), 
                0 4px 0 0 var(--accent-primary);
        }

        /* --- 7. PLACEHOLDER CARD --- */
        .game-card.locked {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #1a1a1a;
        }
        .game-card.locked:hover {
            transform: none;
            box-shadow: 
                -4px 0 0 0 #000, 
                4px 0 0 0 #000, 
                0 -4px 0 0 #000, 
                0 4px 0 0 #000;
        }

        /* --- 8. ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- 9. RESPONSIVE QUERIES --- */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .logo-box { margin-top: 20px; margin-bottom: 40px; }
            
            .game-grid {
                flex-direction: column;
                align-items: center;
            }

            .game-card {
                width: 100%;
                max-width: 340px;
                height: 300px;
            }

            .game-icon { font-size: 3rem; margin-top: 10px; }
            .play-btn { width: 100%; padding: 20px; } /* Large touch target */
        }
    </style>
</head>
<body>

    <div class="sky-bg"></div>
    <div class="retro-bg"></div>
    <div class="scanlines"></div>

    <main class="container">
        
        <header class="logo-box">
            <h1>BROWSERCADE</h1>
            <div class="subtitle">INSERT COIN TO START</div>
        </header>

        <div class="game-grid">

            <a href="./MemoryQuest/index.html" class="game-card">
                <div class="card-inner">
                    <div class="game-icon">🗝️</div>
                    <div class="game-title">MEMORY<br>QUEST</div>
                    <div class="game-desc">Match the runes.<br>Escape the dungeon.<br>8-Bit Adventure.</div>
                    <div class="play-btn">START GAME</div>
                </div>
            </a>

            <div class="game-card locked">
                <div class="card-inner">
                    <div class="game-icon">🔒</div>
                    <div class="game-title">LOCKED</div>
                    <div class="game-desc">New challenger<br>approaching...</div>
                    <div class="play-btn">WAIT</div>
                </div>
            </div>

            <div class="game-card locked">
                <div class="card-inner">
                    <div class="game-icon">👾</div>
                    <div class="game-title">EMPTY<br>SLOT</div>
                    <div class="game-desc">Under Construction</div>
                    <div class="play-btn">...</div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Simple Audio Context for UI Sounds (Pure JS, no assets needed)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // Function to create a retro "bloop" sound
        function playHoverSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'square'; // Square wave = 8-bit sound
            oscillator.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
            oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // Slide up

            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        // Add sound to all active game cards
        document.querySelectorAll('.game-card:not(.locked)').forEach(card => {
            card.addEventListener('mouseenter', playHoverSound);
            // Also play on touch for mobile feedback
            card.addEventListener('touchstart', playHoverSound);
        });

        console.log("Browsercade Initialized. Cyber-Blue Theme Active.");
    </script>
</body>
</html>
